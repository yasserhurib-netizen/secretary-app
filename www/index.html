<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e6a69">
<title>سكرتيرتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a paper-like day sheet. One filled "next up" panel on top, a quick-add bar, then the agenda as ruled rows grouped by day. */
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --ink: #12282a;
  --muted: #5d7476;
  --line: #d3dedd;
  --accent: #0e6a69;
  --on-accent: #ffffff;
  --accent-soft: #d9ecea;
  --alert: #b8420f;
  --alert-soft: #fde6d9;
  --lecture: #0e6a69;
  --meeting: #4a4fa3;
  --visit: #a5611a;
  --font-display: "Reem Kufi", "Segoe UI", Tahoma, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a1c; --surface: #152427; --ink: #e5efee; --muted: #93aaa9; --line: #26393b;
    --accent: #46c2b6; --on-accent: #06201e; --accent-soft: #1b3a3b; --alert: #ff9a6a; --alert-soft: #3a2218;
    --lecture: #46c2b6; --meeting: #9ea3ff; --visit: #e9b06a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a1c; --surface: #152427; --ink: #e5efee; --muted: #93aaa9; --line: #26393b;
  --accent: #46c2b6; --on-accent: #06201e; --accent-soft: #1b3a3b; --alert: #ff9a6a; --alert-soft: #3a2218;
  --lecture: #46c2b6; --meeting: #9ea3ff; --visit: #e9b06a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(56px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin-inline: auto; display: flex; flex-direction: column; gap: 22px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.1; margin: 0; letter-spacing: 0; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.clock { font-family: var(--font-display); font-size: 34px; font-weight: 600; line-height: 1; direction: ltr; }
.clock small { font-size: 15px; color: var(--muted); margin-inline-start: 6px; font-family: var(--font-body); }

/* alerts overlay */
#alerts { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; flex-direction: column; gap: 10px; }
.alert {
  background: var(--alert); color: #fff; border-radius: 14px; padding: 16px 18px;
  display: grid; gap: 10px; box-shadow: 0 8px 28px rgb(0 0 0 / 0.25);
}
:root[data-theme="dark"] .alert { color: #1a0b03; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .alert { color: #1a0b03; } }
.alert .kicker { font-size: 13px; font-weight: 600; letter-spacing: .04em; display: flex; align-items: center; gap: 8px; }
.alert .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; animation: pulse 1.2s ease-in-out infinite; }
.alert h2 { margin: 0; font-family: var(--font-display); font-size: 26px; line-height: 1.25; text-wrap: balance; }
.alert .when { font-size: 17px; }
.alert .row { display: flex; gap: 8px; flex-wrap: wrap; }
.alert button { border: 2px solid currentColor; background: transparent; border-radius: 10px; padding: 8px 16px; font-weight: 600; }
.alert button.solid { background: #fff; color: #7a2a06; border-color: #fff; }
:root[data-theme="dark"] .alert button.solid { background: #1a0b03; color: #ffd9c6; border-color: #1a0b03; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .alert button.solid { background: #1a0b03; color: #ffd9c6; border-color: #1a0b03; } }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .alert .dot { animation: none; } }

/* next-up panel */
.next { background: var(--accent); color: var(--on-accent); border-radius: 18px; padding: 20px 22px; display: grid; gap: 14px; }
.next .label { font-size: 13px; letter-spacing: .06em; opacity: .85; }
.next h2 { margin: 0; font-family: var(--font-display); font-size: 30px; line-height: 1.25; text-wrap: balance; overflow-wrap: anywhere; }
.next .meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
.next .at { font-family: var(--font-display); font-size: 40px; font-weight: 600; line-height: 1; }
.next .in { font-size: 18px; font-weight: 500; }
.next .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.next.empty { background: var(--surface); color: var(--ink); border: 1px dashed var(--line); }
.next.empty h2 { font-size: 22px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; border-radius: 10px; padding: 9px 16px;
  border: 1.5px solid currentColor; background: transparent; font-weight: 500;
}
.next .btn { color: var(--on-accent); }
.btn.fill { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn svg, .icon-btn svg { width: 18px; height: 18px; flex: none; }

/* enable bar */
.enable {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  background: var(--alert-soft); border-radius: 12px; padding: 12px 16px; font-size: 15px;
}
.enable.on { background: var(--accent-soft); }
.enable .state { display: flex; align-items: center; gap: 10px; min-width: 0; }
.led { width: 10px; height: 10px; border-radius: 50%; background: var(--alert); flex: none; }
.enable.on .led { background: var(--accent); }

/* quick add */
.add { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.wrap > *, .add > * { min-width: 0; }
.add .bar { display: flex; gap: 8px; align-items: stretch; }
.add input[type=text] {
  flex: 1; min-width: 0; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 12px 14px; font-size: 17px;
}
.add input[type=text]::placeholder { color: var(--muted); }
.icon-btn {
  width: 48px; flex: none; display: grid; place-items: center; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--accent);
}
.icon-btn.rec { background: var(--alert); border-color: var(--alert); color: #fff; animation: pulse 1.2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .icon-btn.rec { animation: none; } }
.hint { color: var(--muted); font-size: 14px; min-height: 22px; }
.hint.err { color: var(--alert); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px;
  font-size: 14px; color: var(--ink);
}
details.manual { border-top: 1px solid var(--line); padding-top: 8px; }
details.manual summary { cursor: pointer; color: var(--accent); font-weight: 500; padding: 4px 0; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; padding-top: 10px; }
.form label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); min-width: 0; }
.form input, .form select {
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 10px; color: var(--ink); min-width: 0; width: 100%;
}
.form .wide { grid-column: 1 / -1; }
.form .check { display: flex; align-items: center; gap: 8px; color: var(--ink); }
.form .check input { width: 18px; height: 18px; }
.form .row { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }

/* agenda */
.agenda h3 { font-family: var(--font-display); font-size: 18px; margin: 18px 0 0; padding-bottom: 6px; border-bottom: 2px solid var(--ink); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.agenda h3 span { font-family: var(--font-body); font-size: 13px; font-weight: 400; color: var(--muted); }
.item { display: grid; grid-template-columns: 78px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.item.past { opacity: .5; }
.item .t { font-family: var(--font-display); font-size: 22px; font-weight: 600; line-height: 1.1; direction: ltr; text-align: end; }
.item .t small { display: block; font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 400; }
.item .main { min-width: 0; }
.item .title { font-weight: 600; overflow-wrap: anywhere; }
.item .sub { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 13px; color: var(--muted); }
.tag { font-weight: 600; font-size: 12px; padding: 1px 9px; border-radius: 999px; border: 1.5px solid currentColor; }
.tag.lecture { color: var(--lecture); } .tag.meeting { color: var(--meeting); } .tag.visit { color: var(--visit); }
.item .tools { display: flex; gap: 2px; }
.tool { border: 0; background: transparent; padding: 8px; border-radius: 8px; color: var(--muted); display: grid; place-items: center; }
.tool:hover { background: var(--accent-soft); color: var(--ink); }
.tool svg { width: 18px; height: 18px; }
.empty-state { border: 1px dashed var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 10px; background: var(--surface); }
.empty-state h3 { all: unset; font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.empty-state p { margin: 0; color: var(--muted); }

/* footer */
.foot { display: grid; gap: 10px; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
.foot .line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.foot select { background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 4px 8px; color: var(--ink); }
.foot .link { background: none; border: 0; color: var(--accent); text-decoration: underline; padding: 0; }

#toast {
  position: fixed; inset-inline: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; place-items: center; pointer-events: none; z-index: 30;
}
#toast div { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; display: flex; gap: 14px; align-items: center; pointer-events: auto; max-width: min(92vw, 520px); }
#toast button { background: none; border: 0; color: inherit; text-decoration: underline; font-weight: 600; padding: 0; }

@media (max-width: 480px) {
  .item { grid-template-columns: 64px 1fr; }
  .item .tools { grid-column: 1 / -1; justify-content: flex-start; }
  .next h2 { font-size: 25px; } .next .at { font-size: 34px; }
}
</style>
</head>
<body>
<div class="wrap" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand">
      <h1>سكرتيرتي</h1>
      <p id="today-label" class="num"></p>
    </div>
    <div class="clock num" id="clock" aria-live="off"></div>
  </header>

  <div id="alerts" role="alert" aria-live="assertive"></div>

  <div id="enable" class="enable">
    <div class="state"><span class="led"></span><span id="enable-text">التنبيهات الصوتية غير مفعّلة. فعّلها ليصلك التنبيه قبل كل موعد.</span></div>
    <button class="btn fill" id="enable-btn" type="button">فعّل التنبيهات</button>
  </div>

  <section id="next" class="next" aria-label="الموعد القادم"></section>

  <section class="add" aria-label="إضافة موعد">
    <div class="bar">
      <input type="text" id="quick" inputmode="text" autocomplete="off" placeholder="اكتب أو قُل: محاضرة البرمجة غدًا الساعة 5 مساءً" aria-label="موعد جديد">
      <button class="icon-btn" id="mic" type="button" aria-label="إدخال صوتي" title="إدخال صوتي">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button class="btn fill" id="quick-add" type="button">أضف</button>
    </div>
    <div class="hint" id="hint">اذكر الموعد والوقت. لتكرار المحاضرة كل أسبوع قل: كل أحد.</div>
    <div class="chips" id="examples"></div>
    <details class="manual" id="manual">
      <summary>إضافة أو تعديل يدويًا</summary>
      <form class="form" id="form" autocomplete="off">
        <label class="wide" for="f-title">العنوان<input id="f-title" type="text" required placeholder="مثال: محاضرة مقدمة في البرمجة"></label>
        <label for="f-type">النوع
          <select id="f-type"><option value="lecture">محاضرة</option><option value="visit">موعد</option><option value="meeting">اجتماع</option></select>
        </label>
        <label for="f-date">التاريخ<input id="f-date" type="date" required></label>
        <label for="f-time">الوقت<input id="f-time" type="time" required></label>
        <label for="f-lead">التنبيه قبل
          <select id="f-lead"><option value="5">5 دقائق</option><option value="10" selected>10 دقائق</option><option value="15">15 دقيقة</option><option value="30">30 دقيقة</option><option value="60">ساعة</option></select>
        </label>
        <label class="check wide" for="f-repeat"><input id="f-repeat" type="checkbox"> يتكرر كل أسبوع في اليوم نفسه (مناسب للمحاضرات)</label>
        <div class="row">
          <button class="btn fill" type="submit" id="f-save">حفظ</button>
          <button class="btn" type="button" id="f-cancel">إلغاء</button>
        </div>
      </form>
    </details>
  </section>

  <section class="agenda" id="agenda" aria-label="جدول المواعيد"></section>

  <footer class="foot">
    <div class="line">
      <label for="lead-default">التنبيه المسبق الافتراضي:</label>
      <select id="lead-default"><option value="5">5 دقائق</option><option value="10">10 دقائق</option><option value="15">15 دقيقة</option><option value="30">30 دقيقة</option></select>
      <button class="link" id="test-alert" type="button">تجربة التنبيه والصوت</button>
    </div>
    <div class="line"><span id="sync-note"></span></div>
    <div class="line"><span id="voice-note"></span></div>
    <div>التنبيهات تعمل ما دامت هذه الصفحة مفتوحة في المتصفح. على الهاتف أبقِ الشاشة مضاءة أو الصفحة في المقدمة.</div>
  </footer>
</div>
<div id="toast" aria-live="polite"></div>

<script>
document.documentElement.dir = 'rtl';
document.documentElement.lang = 'ar';

/* ============ parser (pure functions) ============ */
//<parser>
var DAY_NAMES = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var DAY_KEYS = { 'احد':0, 'اثنين':1, 'ثلاثاء':2, 'اربعاء':3, 'خميس':4, 'جمعه':5, 'سبت':6 };
var HOUR_WORDS = [
  ['الحاديه عشره',11],['الثانيه عشره',12],['احد عشر',11],['اثنا عشر',12],['اثني عشر',12],
  ['الواحده',1],['الثانيه',2],['الثالثه',3],['الرابعه',4],['الخامسه',5],['السادسه',6],['السابعه',7],['الثامنه',8],['التاسعه',9],['العاشره',10],
  ['واحده',1],['اثنتين',2],['اثنين',2],['ثلاثه',3],['اربعه',4],['خمسه',5],['سته',6],['سبعه',7],['ثمانيه',8],['تسعه',9],['عشره',10]
];
function normAr(s) {
  return s.replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
    .replace(/[٠-٩]/g, function (c) { return String(c.charCodeAt(0) - 1632); })
    .replace(/[۰-۹]/g, function (c) { return String(c.charCodeAt(0) - 1776); });
}
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function isoDate(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function mkDate(iso, hhmm) {
  var p = iso.split('-').map(Number), t = (hhmm || '00:00').split(':').map(Number);
  return new Date(p[0], p[1] - 1, p[2], t[0], t[1], 0, 0);
}
function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); return x; }
function parseQuick(text, now) {
  var s = String(text || '').replace(/[ً-ْـ]/g, '').replace(/\s+/g, ' ').trim();
  s = s.replace(/[٠-٩]/g, function (c) { return String(c.charCodeAt(0) - 1632); }).replace(/[۰-۹]/g, function (c) { return String(c.charCodeAt(0) - 1776); });
  var n = normAr(s);
  function bnd(src) { return new RegExp('(?:^|\\s)(?:' + src + ')(?=\\s|$|[،,.:؟?])'); }
  function cut(re) {
    var m = re.exec(n);
    if (!m) return null;
    var len = m[0].length;
    s = s.slice(0, m.index) + ' ' + s.slice(m.index + len);
    n = n.slice(0, m.index) + ' ' + n.slice(m.index + len);
    return m;
  }
  var DAYS = '(?:ال)?(?<dn>احد|اثنين|ثلاثاء|اربعاء|خميس|جمعه|سبت)';
  var today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var date = null, weekday = null, repeat = 'none', m;

  m = cut(bnd('(?<y>\\d{4})-(?<mo>\\d{1,2})-(?<d>\\d{1,2})'));
  if (m) date = new Date(+m.groups.y, +m.groups.mo - 1, +m.groups.d);
  if (!date) {
    m = cut(bnd('(?<d>\\d{1,2})/(?<mo>\\d{1,2})(?:/(?<y>\\d{2,4}))?'));
    if (m) {
      var yy = m.groups.y ? +m.groups.y : today0.getFullYear();
      if (yy < 100) yy += 2000;
      date = new Date(yy, +m.groups.mo - 1, +m.groups.d);
      if (!m.groups.y && date < today0) date = new Date(yy + 1, +m.groups.mo - 1, +m.groups.d);
    }
  }
  if (!date) { m = cut(bnd('بعد\\s+(?<k>\\d{1,3})\\s+(?:ايام|يوم)')); if (m) date = addDays(today0, +m.groups.k); }
  if (!date) { m = cut(bnd('بعد\\s+غد(?:ا)?')); if (m) date = addDays(today0, 2); }
  if (!date) { m = cut(bnd('غدا|غد|بكره|بكرا')); if (m) date = addDays(today0, 1); }
  if (!date) { m = cut(bnd('اليوم|الليله|هالليله')); if (m) date = today0; }
  m = cut(bnd('(?:كل\\s+(?:يوم\\s+)?' + DAYS + '|كل\\s+اسبوع|اسبوعيا)'));
  if (m) { repeat = 'weekly'; if (m.groups.dn) weekday = DAY_KEYS[m.groups.dn]; }
  if (weekday === null && !date) {
    m = cut(bnd('(?:يوم\\s+)?' + DAYS));
    if (m) weekday = DAY_KEYS[m.groups.dn];
  }

  var FR = '(?:\\s*(?<fr>و\\s*(?:ال)?(?:نصف|ربع|ثلث)|الا\\s*(?:ال)?(?:ربع|ثلث)))?';
  var h24 = false, hour = null, minute = 0, word = HOUR_WORDS.map(function (w) { return w[0]; }).join('|');
  m = cut(bnd('(?:الساعه|ساعه)\\s*(?<h>\\d{1,2})(?:[:.](?<mi>\\d{2}))?' + FR));
  if (!m) m = cut(bnd('(?<h>\\d{1,2}):(?<mi>\\d{2})' + FR));
  if (!m) m = cut(new RegExp('(?:^|\\s)(?<h>\\d{1,2})(?:[:.](?<mi>\\d{2}))?(?=\\s*(?:صباحا|مساء|ظهرا|عصرا|ليلا|ص|م)(?:\\s|$|[،,.]))' + FR.replace('(?<fr>', '(?<fr>')));
  if (!m) {
    m = cut(bnd('(?:الساعه|ساعه)\\s*(?<hw>' + word + ')' + FR));
    if (m) { for (var i = 0; i < HOUR_WORDS.length; i++) if (HOUR_WORDS[i][0] === m.groups.hw) hour = HOUR_WORDS[i][1]; }
  } else { hour = +m.groups.h; if (/^0\d$/.test(m.groups.h)) h24 = true; }
  if (m) {
    if (m.groups.mi) minute = +m.groups.mi;
    var fr = m.groups.fr || '';
    if (/نصف/.test(fr)) minute = 30;
    else if (/ثلث/.test(fr)) { if (/^الا/.test(fr)) { hour -= 1; minute = 40; } else minute = 20; }
    else if (/ربع/.test(fr)) { if (/^الا/.test(fr)) { hour -= 1; minute = 45; } else minute = 15; }
  }
  var period = null;

  var it = { id: uid(), title: p.title, type: p.type, date: p.date, time: p.time, repeat: p.repeat, lead: p.lead || defaultLead };
  items.push(it); save(); renderAll();
  var confirmMsg = 'تم تسجيل ' + spokenTitle(it) + '، ' + (it.repeat === 'weekly' ? 'كل ' + DAY_NAMES[mkDate(it.date, '00:00').getDay()] : dayLabel(it.date)) + '، ' + speechTime(it.time) + '.';
  if (say) speak(confirmMsg);
  toast('تمت الإضافة: ' + it.title + ' · ' + fmtTime(it.time), function () { items = items.filter(function (x) { return x.id !== it.id; }); save(); renderAll(); });
}
function setHint(t, err) { var h = $('hint'); h.textContent = t; h.classList.toggle('err', !!err); }
function submitQuick(viaVoice) {
  var v = $('quick').value.trim();
  if (!v) { setHint('اكتب الموعد أولًا.', true); return; }
  var p = parseQuick(v, new Date());
  if (p.error) {
    setHint('لم أفهم الوقت. اذكر الساعة مثل: الساعة 5 مساءً، أو 17:30.', true);
    if (viaVoice) speak('لم أفهم الوقت. أعد المحاولة وقل الساعة.');
    return;
  }
  var warn = p.guessed ? ' (فهمتها مساءً، عدّلها إن أردت صباحًا)' : '';
  p.lead = defaultLead;
  addItem(p, viaVoice || active);
  $('quick').value = '';
  setHint('أضفت: ' + p.title + ' · ' + dayLabel(p.date) + ' ' + fmtTime(p.time) + warn);
}

/* voice input */
var rec = null;
async function startVoice() {
  var SRp = plug('SpeechRecognition');
  if (!SRp) { startVoiceWeb(); return; }
  try {
    await SRp.requestPermissions();
    var av = await SRp.available();
    if (!av || !av.available) { setHint('خدمة التعرف على الكلام غير متوفرة. استخدم ميكروفون لوحة المفاتيح للإملاء.', true); $('quick').focus(); return; }
    $('mic').classList.add('rec'); setHint('أسمعك... قل الموعد والوقت.');
    var r = await SRp.start({ language: 'ar-SA', maxResults: 1, prompt: 'قل الموعد والوقت', popup: true, partialResults: false });
    $('mic').classList.remove('rec');
    var t = r && r.matches && r.matches[0];
    if (t) { $('quick').value = t; submitQuick(true); } else setHint('لم أسمع شيئًا. جرّب مرة أخرى.', true);
  } catch (e) {
    $('mic').classList.remove('rec');
    setHint('تعذّر الإدخال الصوتي. اسمح للتطبيق باستخدام الميكروفون من إعدادات الهاتف.', true);
  }
}
function startVoiceWeb() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { setHint('هذا المتصفح لا يدعم الإدخال الصوتي. اضغط على الميكروفون في لوحة مفاتيح هاتفك للإملاء داخل الخانة.', true); $('quick').focus(); return; }
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = 'ar-SA'; rec.interimResults = true; rec.maxAlternatives = 1;
  var finalText = '';
  rec.onstart = function () { $('mic').classList.add('rec'); setHint('أسمعك... قل الموعد والوقت.'); };
  rec.onresult = function (e) {
    var t = '';
    for (var i = e.resultIndex; i < e.results.length; i++) { t += e.results[i][0].transcript; if (e.results[i].isFinal) finalText = t; }
    $('quick').value = t;
  };
  rec.onerror = function (e) {
    $('mic').classList.remove('rec'); rec = null;
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') setHint('هذه الصفحة لا تملك إذن الميكروفون هنا. اضغط على ميكروفون لوحة مفاتيح هاتفك للإملاء داخل الخانة، ثم اضغط أضف.', true);
    else if (e.error === 'no-speech') setHint('لم أسمع شيئًا. جرّب مرة أخرى.', true);
    else setHint('تعذّر الإدخال الصوتي (' + e.error + ').', true);
  };
  rec.onend = function () { $('mic').classList.remove('rec'); rec = null; if (finalText) submitQuick(true); };
  try { rec.start(); } catch (e) { rec = null; }
}

/* reading the agenda aloud */
function sayToday() {
  var now = new Date(), end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59);
  var left = occurrences(now, now).filter(function (o) { return o.start > now; });
  if (!left.length) { speak('لا توجد لديك مواعيد متبقية اليوم.'); return; }
  var parts = left.map(function (o) { return spokenTitle(o.it) + '، ' + speechTime(o.it.time); });
  speak('لديك اليوم ' + (left.length === 1 ? 'موعد واحد' : left.length === 2 ? 'موعدان' : left.length + ' مواعيد') + '. ' + parts.join('. ثم ') + '.');
}
function sayNext() {
  var o = nextOcc();
  if (!o) { speak('لا توجد لديك مواعيد قادمة.'); return; }
  speak('موعدك القادم ' + spokenTitle(o.it) + '، ' + dayLabel(o.iso) + '، ' + speechTime(o.it.time) + '.');
}

/* manual form */
function openForm(it) {
  editingId = it ? it.id : null;
  $('manual').open = true;
  $('f-title').value = it ? it.title : '';
  $('f-type').value = it ? it.type : 'lecture';
  $('f-date').value = it ? it.date : isoDate(new Date());
  $('f-time').value = it ? it.time : '';
  $('f-lead').value = String(it ? it.lead : defaultLead);
  $('f-repeat').checked = it ? it.repeat === 'weekly' : false;
  $('f-save').textContent = it ? 'حفظ التعديل' : 'حفظ';
  $('manual').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function closeForm() { editingId = null; $('form').reset(); $('f-lead').value = String(defaultLead); $('manual').open = false; $('f-save').textContent = 'حفظ'; }

/* wiring */
$('enable-btn').onclick = activate;
$('mic').onclick = startVoice;
$('quick-add').onclick = function () { submitQuick(false); };
$('quick').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submitQuick(false); } });
$('next').addEventListener('click', function (e) {
  if (e.target.closest('#say-next')) sayNext();
  if (e.target.closest('#say-today')) sayToday();
});
$('agenda').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var id = b.closest('.item').dataset.id, it = items.find(function (x) { return x.id === id; });
  if (!it) return;
  if (b.dataset.act === 'edit') openForm(it);
  if (b.dataset.act === 'del') {
    var snapshot = items.slice();
    items = items.filter(function (x) { return x.id !== id; }); save(); renderAll();
    toast('حُذف: ' + it.title, function () { items = snapshot; save(); renderAll(); });
  }
});
$('form').addEventListener('submit', function (e) {
  e.preventDefault();
  var data = { title: $('f-title').value.trim(), type: $('f-type').value, date: $('f-date').value, time: $('f-time').value, lead: +$('f-lead').value, repeat: $('f-repeat').checked ? 'weekly' : 'none' };
  if (!data.title || !data.date || !data.time) return;
  if (editingId) {
    items = items.map(function (x) { return x.id === editingId ? Object.assign({}, x, data) : x; });
    save(); renderAll(); toast('تم حفظ التعديل');
  } else addItem(data, active);
  closeForm();
});
$('f-cancel').onclick = closeForm;
$('lead-default').value = String(defaultLead);
$('f-lead').value = String(defaultLead);
$('lead-default').onchange = function () { defaultLead = +this.value; lsSet(LS.lead, defaultLead); $('f-lead').value = String(defaultLead); toast('سأنبّهك قبل المواعيد الجديدة بـ ' + defaultLead + ' دقائق'); };
$('test-alert').onclick = function () {
  var fake = { id: 'test', title: 'تجربة التنبيه', type: 'visit', time: pad2(new Date().getHours()) + ':' + pad2(new Date().getMinutes()), lead: defaultLead };
  var st = new Date(Date.now() + defaultLead * 60000);
  fake.time = pad2(st.getHours()) + ':' + pad2(st.getMinutes());
  if (!active) activate();
  raise({ it: fake, iso: isoDate(st), start: st }, 'pre');
};

var EXAMPLES = ['محاضرة البرمجة كل أحد الساعة 10 صباحًا', 'موعد الطبيب غدًا الساعة 4:30 عصرًا', 'اجتماع المشروع بعد غد الساعة 11 صباحًا', 'ذكرني بتسليم الوظيفة يوم الخميس الساعة 8 مساءً'];
$('examples').innerHTML = EXAMPLES.map(function (t) { return '<button type="button" class="chip">' + esc(t) + '</button>'; }).join('');
$('examples').addEventListener('click', function (e) { var c = e.target.closest('.chip'); if (c) { $('quick').value = c.textContent; $('quick').focus(); } });

if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } else pickVoice();
pruneOld(); setSync(); renderAll(); renderClock();
if (isNative) {
  var fl = document.querySelector('.foot > div:last-child');
  if (fl) fl.textContent = 'إن لم يصلك تنبيه والتطبيق مغلق: اسمح بالإشعارات والمنبّهات الدقيقة، وأوقف «توفير البطارية» لهذا التطبيق من إعدادات الهاتف.';
  nativeInit(false);
}
setInterval(function () { renderClock(); tick(); if (alerts.length) renderAlerts(); }, 1000);
setInterval(function () { renderNext(); renderAgenda(); }, 60000);
</script>
